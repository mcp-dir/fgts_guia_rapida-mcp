# Smithery configuration for FGTS: Emissão de Guia Rápida
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_fgts_guia_rapida

name: fgts_guia_rapida-mcp
displayName: "FGTS: Emissão de Guia Rápida"
description: >
  FGTS: Emissão de Guia Rápida, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/fgts_guia_rapida-mcp
repository: https://github.com/mcp-dir/fgts_guia_rapida-mcp

tags:
  - fgts_guia_rapida
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_fgts_guia_rapida

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_fgts_guia_rapida/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
